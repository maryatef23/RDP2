name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings & Virtual Screen Core
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          \$upper = [char[]](65..90)
          \(lower = [char[]](97..122)\)number = [char[]](48..57)
          \(special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))\)rawPassword = @()
          rawPassword += upper | Get-Random -Count 4
          rawPassword += lower | Get-Random -Count 4
          rawPassword += number | Get-Random -Count 4
          rawPassword += special | Get-Random -Count 4
          password = -join (rawPassword | Sort-Object { Get-Random })
          securePass = ConvertTo-SecureString password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password \$securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_CREDS=User: RDP | Password: password" >> env:GITHUB_ENV
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          \$tsUrl = "https://tailscale.com"
          installerPath = "env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri tsUrl -OutFile installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item \$installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-\(env:GITHUB_RUN_ID\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          if (-not \$tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: \$env:TAILSCALE_IP"
          testResult = Test-NetConnection -ComputerName env:TAILSCALE_IP -Port 3389
          if (-not \$testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Deploy Shielded Brave Core & Dependencies
        run: |
          \$braveUrl = "https://brave.com"
          installerPath = "env:TEMP\brave_installer.exe"
          curl.exe -L -o installerPath braveUrl
          Start-Process -FilePath \$installerPath -ArgumentList "--silent", "--install" -Wait
          Remove-Item \$installerPath -Force

      - name: Inject Secure Cloud Profiles Architecture
        run: |
          \$fileId = "162PEqqxY0Z-sOuxIWoj6p6zUpdCfdc9V"
          zipOutputPath = "env:TEMP\MasterFarmData.zip"
          braveDataPath = "env:LOCALAPPDATA\BraveSoftware\Brave-Browser"
          if (Test-Path braveDataPath) Remove-Item braveDataPath -Recurse -Force | Out-Null }
          New-Item -ItemType Directory -Force -Path \$braveDataPath | Out-Null
          \(downloadUrl = "https://google.com\)fileId&confirm=t"
          curl.exe -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o zipOutputPath downloadUrl
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory(zipOutputPath, braveDataPath)
          Remove-Item \$zipOutputPath -Force

      - name: Open 25 Shielded Farm Profiles Natively
        run: |
          bravePath = "env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe"
          if (-not (Test-Path \$bravePath)) { bravePath = "env:ProgramFiles(x86)\BraveSoftware\Brave-Browser\Application\brave.exe" }
          if (-not (Test-Path \$bravePath)) { bravePath = "env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe" }
          Start-Process \$bravePath -ArgumentList "--profile-directory=""Default"""
          for (\$i = 1; i -le 24; i++) {
              Start-Process bravePath -ArgumentList "--profile-directory=""Profile i"""
              Start-Sleep -Milliseconds 500
          }

      - name: Maintain Connection & Prevent GUI Freeze Loop
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          \$timeout = (Get-Date).AddHours(5).AddMinutes(50)
          while ((Get-Date) -lt \$timeout) {
              [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point((Get-Random -Min 1 -Max 500), (Get-Random -Min 1 -Max 500))
              Write-Host "[\$(Get-Date)] Virtual GUI Live - Anti-Lock Triggered Successful"
              Start-Sleep -Seconds 240
          }
