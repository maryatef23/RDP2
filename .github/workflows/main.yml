name: Windows Build

on:
  workflow_dispatch:

jobs:
  windows-job:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show system information
        shell: pwsh
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Install Brave
        shell: pwsh
        run: |
          winget install --id Brave.Brave --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      - name: Verify Brave installation
        shell: pwsh
        run: |
          $paths = @(
            "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
            "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"
          )

          $brave = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $brave) {
            Write-Error "Brave was not found."
            exit 1
          }

          Write-Host "Brave found at: $brave"

      - name: Run browser test
        shell: pwsh
        run: |
          $brave = @(
            "$env:ProgramFiles\BraveSoftware\Brave-Browser\Application\brave.exe",
            "${env:ProgramFiles(x86)}\BraveSoftware\Brave-Browser\Application\brave.exe",
            "$env:LOCALAPPDATA\BraveSoftware\Brave-Browser\Application\brave.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($brave) {
            Start-Process -FilePath $brave `
              -ArgumentList "--headless", "--disable-gpu", "--dump-dom", "https://example.com" `
              -Wait
          }

      - name: Finish
        shell: pwsh
        run: |
          Write-Host "Workflow completed successfully."
